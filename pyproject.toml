[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windowsill"
version = "0.2.0"
description = "A local batch queue for Claude Code — SGE-style job files that run prompts unattended in 5-hour windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Ingolf Becker" }]
keywords = ["claude", "claude-code", "batch", "queue", "scheduler", "sge", "llm"]
# Lower bounds, not pins: a queue that sits between the user and their own
# toolchain should not dictate the rest of their environment. click 8.1 is the
# floor for the shell-completion API `windowsill completions` relies on.
dependencies = [
    "click>=8.1",
    "sqlite-utils>=3.36",
]

# No "License ::" classifier here on purpose -- PyPI rejects a metadata 2.4
# upload that sets both a SPDX License-Expression and a license classifier.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/watercrossing/windowsill"
Repository = "https://github.com/watercrossing/windowsill"
Issues = "https://github.com/watercrossing/windowsill/issues"
Changelog = "https://github.com/watercrossing/windowsill/blob/main/CHANGELOG.md"

[project.scripts]
# The SGE-shaped short verbs are the daily interface; `windowsill` stays as
# the dispatcher so `--help` lists everything in one place and cron keeps
# calling `windowsill tick` (design/08-interface.md §8.1).
ccsub = "windowsill.cli:sub"
ccstat = "windowsill.cli:stat"
ccdel = "windowsill.cli:del_"
ccresume = "windowsill.cli:resume"
windowsill = "windowsill.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/windowsill"]

[tool.hatch.build.targets.sdist]
# BLOCKED.md is a scratch pad for notes left by an unattended run for the human
# to read at breakfast. It is repo furniture, not part of the distribution.
exclude = ["BLOCKED.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 153

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
# Formatter reflows to line-length = 153 (see [tool.ruff]).
