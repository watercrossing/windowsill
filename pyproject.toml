[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windowsill"
version = "0.1.0"
description = "A local batch queue for Claude Code — SGE-style job files that run prompts unattended in 5-hour windows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "sqlite-utils",
]

[project.urls]
Repository = "https://github.com/watercrossing/ccq"

[project.scripts]
# The SGE-shaped short verbs are the daily interface; `ccq` stays as the
# dispatcher so `--help` lists everything in one place and cron keeps
# calling `ccq tick` (design/08-interface.md §8.1).
ccsub = "windowsill.cli:sub"
ccstat = "windowsill.cli:stat"
ccdel = "windowsill.cli:del_"
ccresume = "windowsill.cli:resume"
ccq = "windowsill.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/windowsill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 153

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
# Formatter reflows to line-length = 153 (see [tool.ruff]).
