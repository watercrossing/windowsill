# Tests and lint on every push and pull request.
#
# This is the workflow that makes "the tests pass" mean something other than
# "they passed on Ingolf's machine". It is deliberately separate from
# pypi.yaml: that one is bound to a PyPI trusted publisher by filename and
# must not grow triggers, and a release should never be gated on a workflow
# that can be edited casually.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Commits land here in batches of ten, so a push supersedes its predecessor
# often enough to be worth cancelling — but never on main, where each run is
# the only record that a given batch was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one version failing should not hide the other's result
      matrix:
        # pyproject claims both. 3.14 was asserted in the classifiers long
        # before anything ran the suite on it; this is what makes the claim true.
        python-version: ["3.13", "3.14"]
    steps:
      # Action majors are kept current because runners force-upgrade the Node
      # they run on: checkout@v4 and setup-uv@v5 target Node 20, which was
      # deprecated in Sept 2025, and every run warned that it was being run on
      # Node 24 anyway. Being force-upgraded is not a supported configuration
      # -- it works until it doesn't -- so we run the majors that ship Node 24.
      # The breaking changes in between don't touch us: checkout's is the
      # `pull_request_target` checkout default (we only use `push` and
      # `pull_request`), and setup-uv's is `prune-cache` defaulting to false
      # (a cache-size question, not a correctness one).
      #
      # setup-uv is pinned to an exact tag, and has to be: it stopped
      # publishing floating major tags after v7, so `@v8`/`@v9`/`@v10` are
      # unresolvable refs, not old versions. `@v9` was set here on the
      # strength of the release list and failed every run from 2026-08-06 to
      # 2026-08-28 with "unable to find version `v9`" -- at "Set up job",
      # before a single test ran. Bump this by reading
      # `gh api repos/astral-sh/setup-uv/releases --jq '.[].tag_name'`, and
      # do not shorten it back to a major.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails rather than silently re-resolving, so a uv.lock that
      # has drifted from pyproject.toml is a CI failure and not a mystery.
      - run: uv sync --locked --python ${{ matrix.python-version }}

      - run: uv run --no-sync pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact tag, not a major -- see the note in the `test` job above.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      # Two separate calls: `check` is the lint rules (E, F, I), `format
      # --check` is the formatter. Passing one says nothing about the other.
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
